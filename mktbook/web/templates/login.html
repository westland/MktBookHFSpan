<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio de Sesión de Administrador — MktBook</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container" style="max-width:420px; margin-top:6rem;">
        <article>
            <header style="text-align:center;">
                <a href="/"><strong>MktBook</strong></a>
                <h2 style="margin-top:0.5rem;">Inicio de Sesión de Administrador</h2>
                <p style="color:#888; font-size:0.9em; margin:0;">
                    Requerido para las páginas de Calificaciones y Administración.
                </p>
            </header>

            {% if error %}
            <p style="color:#c0392b; text-align:center; margin-bottom:1rem;">
                Contraseña incorrecta — por favor, inténtalo de nuevo.
            </p>
            {% endif %}

            <form method="post" action="/login">
                <input type="hidden" name="next" value="{{ next }}">
                <label>
                    Contraseña
                    <div style="position: relative; display: flex; align-items: center; margin-top: 0.25rem; margin-bottom: 1rem;">
                        <input id="password-input" type="password" name="password" autofocus required
                               placeholder="Introduce la contraseña de administrador" style="padding-right: 2.5rem; margin-bottom: 0; width: 100%;">
                        <span id="toggle-password" style="position: absolute; right: 0.75rem; cursor: pointer; user-select: none; font-size: 1.25rem;" onclick="togglePasswordVisibility()">👁️</span>
                    </div>
                </label>
                <button type="submit" style="width:100%;">Iniciar Sesión</button>
            </form>
        </article>

        <p style="text-align:center; font-size:0.8em; color:#aaa; margin-top:1rem;">
            Simulador de Mercado de Bots MktBook
        </p>
    </main>
    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById("password-input");
            const toggle = document.getElementById("toggle-password");
            if (input.type === "password") {
                input.type = "text";
                toggle.textContent = "🙈";
            } else {
                input.type = "password";
                toggle.textContent = "👁️";
            }
        }
    </script>
</body>
</html>
